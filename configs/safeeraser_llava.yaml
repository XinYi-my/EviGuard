# Example configuration; adjust paths and parameters for your run.
model:
  name: ./models/llava-1.5-7b-hf
  arch: llava
  torch_dtype: float16
  load_in_4bit: true
  bnb_4bit_compute_dtype: float16
  bnb_4bit_quant_type: nf4
  freeze_vision: true
  freeze_llm_base: true
evidence_models:
  blip2: ./models/blip2-opt-2.7b
judge_models:
  roberta_toxic: ./models/toxic-prompt-roberta
lora:
  rank: 32
  alpha: 256
  dropout: 0.05
  target_modules:
  - q_proj
  - k_proj
  - v_proj
  - o_proj
  - gate_proj
  - up_proj
  - down_proj
rsf:
  bottleneck_dim: 512
  dropout: 0.1
  evidence_max_tokens: 64
  default_reliability: 0.5
subspace:
  rank_k: 80
  max_collection_samples: 5000
  min_fit_samples: 81
training:
  seed: 42
  stage1_steps: 600
  stage2_steps: 3600
  total_steps: 4200
  learning_rate: 0.0001
  warmup_steps: 120
  warmup_type: linear
  weight_decay: 0.01
  max_grad_norm: 1.0
  batch_size: 3
  gradient_accumulation_steps: 16
  mixed_precision: fp16
  batch_mix_ratio:
  - 1
  - 1
  - 1
  save_every_steps: 400
  log_every_steps: 10
  evidence_log_every_steps: 100
  eval_every_steps: 400
  num_feedback_iterations: 3
  max_seq_length: 2048
  num_workers: 0
  retain_text_batch_every: 0
  retain_text_batch_size: 2
loss:
  lambda_pd: 1.0
  risk_amplify: 1.5
  gamma: 1.0
  epsilon: 0.05
  lambda_s: 0.3
  lambda_orth: 0.2
  lambda_cm: 0.15
  lambda_conf: 0.03
  hard_sample_threshold: 0.3
  use_pd: true
data:
  safeeraser_root: ./data/safeeraser_dataset/dataset
  train_json: ./data/safeeraser_dataset/dataset/train.json
  val_json: ''
  prompt_json: ./data/safeeraser_dataset/dataset/prompt.json
  img_dir: ./data/safeeraser_dataset/dataset/img
  pdset_img_dir: ./data/safeeraser_dataset/dataset/pdset/image
  siuo_data_dir: ./data/SIUO/data
  siuo_image_dir: ./data/SIUO/images
  siuo_gen_json: ./data/SIUO/data/siuo_gen.json
  siuo_mcqa_json: ./data/SIUO/data/siuo_mcqa.json
  evidence_cache_dir: ./data/evidence_cache
  require_evidence: true
evaluation:
  primary_judge: gpt-4o-2024-11-20
  api_key: ''
  api_url: ''
  max_new_tokens: 512
  temperature: 1.0
  num_inferences: 3
  batch_size: 4
  resume_save_every_batches: 1
  gpt_timeout: 120
  gpt_connect_timeout: 10
  gpt_retries: 3
  gpt_retry_delay: 10
  gpt_disable_after_failures: 5
paths:
  output_dir: ./outputs/llava/safeeraser
  checkpoint_dir: ./checkpoints/llava/safeeraser
  log_dir: ./logs/llava/safeeraser
  figures_dir: ./figures/llava/safeeraser
logging:
  use_wandb: false
  log_activations: true
  save_risk_scores: true
  save_subspace: true
release:
  status: example_configuration
