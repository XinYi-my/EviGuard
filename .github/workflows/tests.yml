name: CPU regression tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      USE_TF: "0"
      CUDA_VISIBLE_DEVICES: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install torch==2.5.1 torchvision==0.20.1 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install transformers==4.57.3 peft==0.18.0 huggingface_hub==0.36.2 accelerate PyYAML numpy Pillow requests rouge-score pytest
      - run: python -m compileall -q src scripts
      - run: python -m pytest -q
